apiVersion: v1
kind: Deployment
metadata:
  name: vpromq  
  labels:
    app: vpromq
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: vpromq
  template:
    metadata:
      labels:
        app: vpromq
    spec:
      containers:
        - name: vpromq
          image: rabbitmq:latest
          ports:
            - name: vpromq-port
              containerPort: 5672
              protocol: TCP
          env:
           - name: RABBITMQ_DEFAULT_USER
             valueFrom:
              secretKeyRef:
               name: app-secret
               key: rmq-user
           - name: RABBITMQ_DEFAULT_PASS
             value: "guest"